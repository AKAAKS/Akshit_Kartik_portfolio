<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Akshit Kartik — AI systems engineer and published researcher. ACM IMWUT and arXiv; agent systems, developer tooling, and research instrumentation. BS Computer Science, Penn State, May 2026." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://akshit-kartik-portfolio.vercel.app/" />
    <meta property="og:title" content="Akshit Kartik" />
    <meta property="og:description" content="AI systems engineer and published researcher. ACM IMWUT and arXiv; agent systems, developer tooling, and research instrumentation." />

    <!-- The landing, captured. Regenerate with `npm run og` after anything
         that changes how it looks - see scripts/make-og.mjs. The file is
         2400x1260 for retina; these tags give the LAYOUT size, which is what
         they are supposed to describe. Absolute URLs because scrapers do not
         resolve relative ones. -->
    <meta property="og:image" content="https://akshit-kartik-portfolio.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="A line drawing of a spacecraft approaching, nose rising from the bottom of the frame past a ringed planet and a field of stars. The name Akshit Kartik is set across the middle." />

    <!-- summary_large_image, not summary: summary crops to a small square and
         throws away the composition this card exists for. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akshit Kartik" />
    <meta name="twitter:description" content="AI systems engineer and published researcher." />
    <meta name="twitter:image" content="https://akshit-kartik-portfolio.vercel.app/og.png" />

    <!-- Light only, by design. See src/styles/tokens.css. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FBFBF9" />

    <!-- NASA digital stack: Inter headings · Public Sans body · DM Mono data -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Public+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Akshit Kartik</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
