<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A tube section: hull edges and one rib, drawn. Light, square, no glow.
       Shapes are kept heavy on purpose so it survives being drawn at 16px. -->
  <rect width="64" height="64" fill="#FBFBF9"/>

  <!-- hull edges -->
  <g stroke="#0F1113" stroke-width="3" fill="none">
    <line x1="12" y1="6" x2="12" y2="58"/>
    <line x1="52" y1="6" x2="52" y2="58"/>
  </g>

  <!-- the rib, as an ellipse: near arc solid, far arc light -->
  <path d="M12 30 A 20 8 0 0 1 52 30" fill="none" stroke="#0F1113" stroke-width="3"/>
  <path d="M12 30 A 20 8 0 0 0 52 30" fill="none" stroke="#0F1113" stroke-width="2" opacity="0.28"/>

  <!-- the hatch, in the one accent colour -->
  <ellipse cx="32" cy="30" rx="7" ry="4.5" fill="#3B3E8C"/>
</svg>
